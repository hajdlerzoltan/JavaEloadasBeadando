
<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>MNB SOAP - ForexWebApp</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" th:href="@{/}">
            ForexWebApp
        </a>

        <a class="nav-link text-white" th:href="@{/}">
            Főoldal
        </a>

    </div>
</nav>

<main class="container py-5">

    <a th:href="@{/}" class="text-decoration-none">
        ← Vissza a főoldalra
    </a>

    <h1 class="mt-3 mb-2">
        MNB SOAP árfolyamlekérdezés
    </h1>

    <p class="text-secondary">
        Magyar Nemzeti Bank devizaárfolyamok lekérdezése.
    </p>

    <!-- Lekérdezési űrlap -->

    <form id="rateForm" class="row g-3 feature-card">

        <div class="col-md-4">

            <label for="currency" class="form-label">
                Deviza kiválasztása
            </label>

            <select id="currency"
                    class="form-select"
                    required>

                <option value="EUR">EUR - Euró</option>
                <option value="USD">USD - Amerikai dollár</option>
                <option value="GBP">GBP - Angol font</option>
                <option value="CHF">CHF - Svájci frank</option>
                <option value="JPY">JPY - Japán jen</option>
                <option value="CZK">CZK - Cseh korona</option>
                <option value="PLN">PLN - Lengyel zloty</option>
                <option value="RON">RON - Román lej</option>

            </select>

        </div>

        <div class="col-md-4">

            <label for="startDate" class="form-label">
                Kezdő dátum
            </label>

            <input type="date"
                   id="startDate"
                   class="form-control"
                   required>

        </div>

        <div class="col-md-4">

            <label for="endDate" class="form-label">
                Befejező dátum
            </label>

            <input type="date"
                   id="endDate"
                   class="form-control"
                   required>

        </div>

        <div class="col-12">

            <button type="submit"
                    id="submitButton"
                    class="btn btn-primary">

                Árfolyamok lekérdezése

            </button>

            <span id="status"
                  class="ms-3 text-secondary"
                  role="status">
            </span>

        </div>

    </form>

    <!-- Hibaüzenet -->

    <div id="errorBox"
         class="alert alert-danger mt-4 d-none"
         role="alert">
    </div>

    <!-- Grafikon -->

    <section class="feature-card mt-4">

        <h2 class="h5 mb-3">
            Árfolyamgrafikon
        </h2>

        <canvas id="exchangeChart"></canvas>

    </section>

    <!-- Táblázat -->

    <section class="feature-card mt-4">

        <h2 class="h5 mb-3">
            Lekérdezett árfolyamok
        </h2>

        <div class="table-responsive">

            <table class="table table-striped table-hover">

                <thead>
                <tr>
                    <th>Dátum</th>
                    <th>Deviza</th>
                    <th>Egység</th>
                    <th>Árfolyam (HUF)</th>
                </tr>
                </thead>

                <tbody id="ratesBody">

                <tr>
                    <td colspan="4">
                        Még nincs lekérdezett adat.
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>

<footer class="site-footer">
    Hajdler Zoltan - R9PCXL
</footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

    let exchangeChart = null;

    document.getElementById("rateForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const currency =
                document.getElementById("currency").value;

            const startDate =
                document.getElementById("startDate").value;

            const endDate =
                document.getElementById("endDate").value;

            const status =
                document.getElementById("status");

            const errorBox =
                document.getElementById("errorBox");

            const button =
                document.getElementById("submitButton");

            const body =
                document.getElementById("ratesBody");

            errorBox.classList.add("d-none");

            if (startDate > endDate) {

                errorBox.textContent =
                    "A kezdő dátum nem lehet későbbi a befejező dátumnál.";

                errorBox.classList.remove("d-none");

                return;
            }

            button.disabled = true;

            status.textContent = "Lekérdezés folyamatban...";

            body.innerHTML =
                "<tr><td colspan='4'>Adatok betöltése...</td></tr>";

            try {

                const params = new URLSearchParams({
                    startDate: startDate,
                    endDate: endDate,
                    currency: currency
                });

                const response = await fetch(
                    "/api/mnb/rates?" + params.toString()
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || "A lekérdezés sikertelen."
                    );
                }

                if (data.length === 0) {

                    body.innerHTML =
                        "<tr><td colspan='4'>Nincs elérhető árfolyam.</td></tr>";

                    if (exchangeChart) {
                        exchangeChart.destroy();
                        exchangeChart = null;
                    }

                    status.textContent = "Nincs találat.";

                    return;
                }

                // Táblázat feltöltése

                body.innerHTML = "";

                data.forEach(rate => {

                    const row = document.createElement("tr");

                    [
                        rate.date,
                        rate.currency,
                        rate.unit,
                        rate.rate
                    ].forEach(value => {

                        const cell = document.createElement("td");

                        cell.textContent = value;

                        row.appendChild(cell);

                    });

                    body.appendChild(row);

                });

                // Korábbi grafikon törlése

                if (exchangeChart) {
                    exchangeChart.destroy();
                }

                // Új grafikon létrehozása

                exchangeChart = new Chart(
                    document.getElementById("exchangeChart"),
                    {
                        type: "line",

                        data: {

                            labels: data.map(rate => rate.date),

                            datasets: [{

                                label: currency + " / HUF",

                                data: data.map(
                                    rate => Number(rate.rate)
                                ),

                                borderWidth: 2,

                                tension: 0.2

                            }]

                        },

                        options: {

                            responsive: true,

                            scales: {

                                y: {
                                    beginAtZero: false
                                }

                            }

                        }

                    }
                );

                status.textContent =
                    data.length + " árfolyam betöltve.";

            } catch (error) {

                body.innerHTML =
                    "<tr><td colspan='4'>A lekérdezés nem sikerült.</td></tr>";

                errorBox.textContent = error.message;

                errorBox.classList.remove("d-none");

                status.textContent = "";

            } finally {

                button.disabled = false;

            }

        });

</script>

</body>
</html>
