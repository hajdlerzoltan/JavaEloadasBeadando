<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' | ForexWebApp'">ForexWebApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/}">ForexWebApp</a><a class="nav-link text-white" th:href="@{/}">Főoldal</a></div></nav>
<main class="container py-5">

<footer class="site-footer"><span th:text="${@environment.getProperty('app.author.name')}">Készítő neve</span> · <span th:text="${@environment.getProperty('app.author.neptun')}">Neptun-kód</span></footer>
</body>
</html>
